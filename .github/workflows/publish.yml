name: publish attentionfarm mod
# Started only by `node scripts/as-app.mjs dispatch`, so the run is attributed
# to the attentionfarm app. A manual run would show the person who clicked it.
on:
  repository_dispatch:
    types: [publish]
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: build and inspect the installable zip
        run: python3 scripts/build-release.py
      - name: publish the bot snapshot
        if: github.event.client_payload.clean_history == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          expected="$(git rev-parse HEAD)"
          git checkout --orphan bot-snapshot
          git add -A
          git commit -m 'publish attentionfarm mod'
          git push --force-with-lease="main:$expected" origin HEAD:main
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].id' | while read -r release_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          done
          git tag --list | while read -r old_tag; do
            git push origin --delete "refs/tags/$old_tag"
            git tag -d "$old_tag"
          done
      - name: publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(jq -r .version .claude-plugin/plugin.json)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "release $version already exists"
            exit 0
          fi
          gh release create "$version" "dist/attentionfarm-mod-$version.zip" "dist/attentionfarm-mod-$version.zip.sha256" --target "$(git rev-parse HEAD)" --title "attentionfarm mod $version" --notes 'log in or sign up inside claude code with a 6-digit email code: no password, no browser. your session key stays in your macos keychain. also a clickable powered by attentionfarm label and a cli ticker: watch ad, get tokens | attentionfarm |. earning is coming soon. macos terminal; requires native claude code mod support. privacy: https://attentionfarm.com/privacy'
